name: Build Safe OCR Tool

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 版本号 = V39.<日期>.<构建序号>,写进 _build_info.py,程序窗口标题里就能看到。
      # 注意:windows 上 run 默认是 PowerShell,原来那句 bash 的 $(date ...) 是空的,
      # 所以之前的 tag 才全是 "v-28" 这种、压缩包名字也永远是 Video_OCR_Extractor_v.zip。
      - name: Stamp version
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $ver  = "V39.$date.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION = `"$ver`""  | Out-File -FilePath _build_info.py -Encoding utf8
          "BUILD_DATE  = `"$date`"" | Out-File -FilePath _build_info.py -Encoding utf8 -Append
          "VER=$ver"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Content _build_info.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Nuitka (Safe Mode)
        uses: Nuitka/Nuitka-Action@main
        with:
          script-name: video_ocr.py
          mode: standalone
          enable-plugins: tk-inter
          disable-console: true
          company-name: "Local Studio"
          product-name: "Video Subtitle Extractor"
          file-version: "39.0.0.${{ github.run_number }}"

      - name: Zip the output
        shell: pwsh
        run: |
          # V28:圆钮模板可以有多张(anchor_template*.png),一起塞进 zip
          Get-ChildItem -Filter "anchor_template*.png" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName build/video_ocr.dist/ -Force
          }
          Compress-Archive -Path build/video_ocr.dist -DestinationPath "Video_OCR_Extractor_${{ env.VER }}.zip"

      # Release 之外再留一份 artifact:构建失败或者想快速下载时用得上
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video_OCR_Extractor_${{ env.VER }}
          path: build/video_ocr.dist

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          files: "*.zip"
          tag_name: "${{ env.VER }}"
          name: "Video Subtitle Extractor ${{ env.VER }}"
          body: |
            **版本**: ${{ env.VER }}
            **日期**: ${{ env.DATE }}
            **构建**: run #${{ github.run_number }} / commit ${{ github.sha }}

            使用方法:
            1. 下载 `Video_OCR_Extractor_${{ env.VER }}.zip` 并解压。
            2. 进入解压后的文件夹 video_ocr.dist。
            3. 双击 video_ocr.exe 运行(窗口标题里会带版本号)。

            改判据不用重新编译:编辑 exe 旁边的 video_ocr_config.json,重启程序生效。
